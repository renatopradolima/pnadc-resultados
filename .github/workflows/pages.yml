name: publicar-no-github-pages

# Publica o arquivo único como página (https://<usuario>.github.io/<repositorio>/), para usar sem baixar nada.
# Ligue antes em Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.implantacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar o arquivo único como index.html
        run: python -I scripts/construir.py --saida site/index.html
      # Medição de acessos (Cloudflare Web Analytics, sem cookies), SÓ na cópia publicada. Para ligar: Settings → Secrets and variables → Actions → Variables →
      # CF_BEACON_TOKEN = o token do site no Cloudflare. Sem a variável, nada é inserido. O arquivo baixado (dist/) nunca é medido.
      - name: Medição de acessos da página (opcional)
        env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        run: python -I scripts/injetar_medicao.py site/index.html "$CF_BEACON_TOKEN"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: implantacao
        uses: actions/deploy-pages@v4
