name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Navegador (o do runner já traz o Chrome)
        run: google-chrome --version
      - name: Gerar o arquivo único
        run: python -I scripts/construir.py
      - name: Suíte (sem rede; a paridade usa testes/esperado)
        run: python -I testes/rodar.py
        env:
          CI: 'true'
